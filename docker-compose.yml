# Local development services. The app itself runs with `npm run dev`.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: studypilot
      POSTGRES_PASSWORD: studypilot
      POSTGRES_DB: studypilot
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/10-test-dbs.sql:ro
volumes:
  db-data:
